# Runtime configuration
# All values use ${VAR} syntax for environment variable interpolation
# If env var is not set, the value will be None - ensure all required vars are set in .env
runtime:
  log_level: ${LOG_LEVEL}
  enable_hooks: ${ENABLE_HOOKS}
  save_output: ${SAVE_OUTPUT}

# Path configuration
paths:
  data_dir: ${DATA_DIR}
  output_log: ${OUTPUT_LOG_PATH}

# Database configuration
database:
  path: ${DB_PATH}

# Notification configuration
notification:
  mcp:
    endpoint: ${MCP_ENDPOINT}
    timeout: ${MCP_TIMEOUT}
    max_retries: ${MCP_MAX_RETRIES}
    retry_delay: ${MCP_RETRY_DELAY}
  channels: ${NOTIFICATION_CHANNELS}

# LLM configuration
llm:
  use_real_openai: ${USE_REAL_OPENAI}

# Tarot Oracle configuration (optional mystical guidance)
tarot:
  enabled: ${TAROT_ENABLED}
