alert_summary_prompt: |
  You are an AI alert summarizer. Analyze the following alerts (JSON list):
  {alerts}

  Provide a JSON object with:
  - summary: short natural language summary
  - categories: list of top categories
  - severity_breakdown: mapping of severity->count
  - root_causes: list of likely root causes

resolution_prompt: |
  You are an AI incident resolution assistant. Given these triaged alerts (JSON):
  {alerts}

  Analyze each alert and provide a JSON object with:
  - resolution_plans: array of objects, each with:
    - alert_id: unique identifier (use timestamp_index format)
    - severity: alert severity
    - category: alert category
    - message: alert message
    - recommended_actions: list of specific remediation steps
    - priority: numeric priority (1=highest, 4=lowest)
    - reasoning: explanation for the recommendations
  - summary: short readable summary for on-call
  - escalation: suggested escalation paths
  - affected_systems: list of affected systems

governance_prompt: |
  You are an AI governance and compliance auditor. Analyze the following final log summary (JSON):
  {log}

  Provide a JSON object with:
  - risk: one of [low, medium, high, critical]
  - escalation: recommended escalation action
  - compliance_issues: list (if any)
  - commentary: short audit commentary

escalation_categorization_guidelines: |
  When generating the governance analysis, classify the escalation into a structured escalation_category using these rules:

  Categories:
    - None: No escalation required, safe, normal operations
    - Monitor: Monitor, keep an eye on issues, follow-up if recurrence
    - Team Review: Team-level review recommended; engineering lead involvement
    - Incident Team: Incident response / on-call team must take action
    - Management: Senior management involvement required; executive review
    - Critical Urgent: Immediate critical response needed; severe operational risks

  Based on the escalation text you generate, include an additional field:
      "escalation_category": "<one_of_the_categories_above>"

  Escalation text may vary, but escalation_category MUST be selected from the controlled vocabulary above.


governance_insights_prompt: |
  You are an AI assistant responsible for analyzing historical incident governance data.

  You will be given structured JSON representing multiple past pipeline runs, including:
  - governance analysis
  - compliance findings
  - category distributions
  - severity distributions
  - escalation patterns

  Historical Data:
  {historical_data}

  Your task is to produce strictly valid JSON with the following fields.
  Each field MUST follow the specified format exactly.

  {{
    "trend_summary": [
        "Short bullet point insight.",
        "Another insight."
    ],
    "risk_trend": [
        "Bullet point describing risk changes over time."
    ],
    "compliance_trend": [
        "Bullet point describing compliance behavior."
    ],
    "recurring_issues": [
        "List recurring root causes or themes."
    ],
    "category_hotspots": [
        "categoryA",
        "categoryB"
    ],
    "recommendations": [
        "Actionable recommendation for engineering leadership."
    ],
    "anomaly_detection": [
        "Describe any abnormalities or outlier behaviors."
    ]
  }}

  Rules:
  - All fields must contain LISTS, not paragraphs.
  - Each list item must be one short sentence or phrase.
  - Do not include sections, labels, headings, markdown, or commentary.
  - Only return the JSON object, nothing else.


